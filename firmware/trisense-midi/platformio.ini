; Optional PlatformIO build. Arduino IDE works without this file.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DTRISENSE_PHASE=1

[env:esp32dev_phase2]
extends = env:esp32dev
build_flags =
  -DTRISENSE_PHASE=2

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DTRISENSE_PHASE=1
